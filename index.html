<!DOCTYPE html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TimerStow</title>
        <link rel="stylesheet" href="style.css">
    </head>

        <h1 id="display-number"><span id="hour-dis">00</span>&colon;<span id="min-dis">00</span>&colon;<span id="sec-dis">00</span>&colon;<span id="milisec-dis">00</span></h1>

        <script src="script.js"></script>
