<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TimerStow</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/6920e0d24e.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="layout-container">
            <header>
                <div class="setting">
                    <button id="setting-gear"><i class="fa-solid fa-gear"></i></button>
                    <div id="dropdown-menu">
                        <ul>
                            <h5>Set countdown: </h5>
                            <li>Hour(s): <input type="number" id="countdown-hours-input" pattern="^[0-9]{1,2}$"></li>
                        </ul>
                    </div>
                </div>
                
            </header>

            <main>
                <h1 id="display-number"><span id="hour-dis">00</span>&colon;<span id="min-dis">00</span>&colon;<span id="sec-dis">00</span><span id="milisec-dis">00</span></h1>
                <div class="button-container">
                    <button class="function-buttons" id="start-but">Start</button>
                    <button class="function-buttons" id="pause-but">Pause</button>
                    <button class="function-buttons" id="reset-but">Reset</button>
                </div>
            </main>

        </div>

        <script src="script.js"></script>

    </body>
</html>
